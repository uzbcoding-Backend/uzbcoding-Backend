<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
<title>From idea to release - developer workflow</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101629"/><stop offset="1" stop-color="#091522"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="390" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="388" rx="22" fill="none" stroke="#2c3953" stroke-width="2"/>
<text x="56" y="60" fill="#fafafa" font-size="29" font-weight="700" font-family="Verdana,Arial,sans-serif">HOW I BUILD SOFTWARE</text>
<text x="56" y="92" fill="#94a3b8" font-size="17" font-family="Verdana,Arial,sans-serif">From an idea to a working, tested project</text>
<path d="M140 218 H1047" stroke="url(#edge)" stroke-width="7" opacity=".42" stroke-linecap="round"/>
<g filter="url(#shadow)">
<rect x="54" y="155" width="174" height="130" rx="17" fill="#17233c" stroke="#a78bfa" stroke-width="2"/>
<rect x="66" y="165" width="150" height="4" rx="2" fill="#a78bfa"/>
<text x="141" y="210" fill="#a78bfa" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="700">01  IDEA</text>
<text x="141" y="243" fill="#e2e8f0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13">Identify the problem</text>
</g>
<g filter="url(#shadow)">
<rect x="284" y="155" width="174" height="130" rx="17" fill="#17233c" stroke="#818cf8" stroke-width="2"/>
<rect x="296" y="165" width="150" height="4" rx="2" fill="#818cf8"/>
<text x="371" y="210" fill="#818cf8" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="700">02  PLAN</text>
<text x="371" y="243" fill="#e2e8f0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13">Design a solution</text>
</g>
<g filter="url(#shadow)">
<rect x="514" y="155" width="174" height="130" rx="17" fill="#17233c" stroke="#38bdf8" stroke-width="2"/>
<rect x="526" y="165" width="150" height="4" rx="2" fill="#38bdf8"/>
<text x="601" y="210" fill="#38bdf8" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="700">03  BUILD</text>
<text x="601" y="243" fill="#e2e8f0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13">Write clean code</text>
</g>
<g filter="url(#shadow)">
<rect x="744" y="155" width="174" height="130" rx="17" fill="#17233c" stroke="#34d399" stroke-width="2"/>
<rect x="756" y="165" width="150" height="4" rx="2" fill="#34d399"/>
<text x="831" y="210" fill="#34d399" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="700">04  TEST</text>
<text x="831" y="243" fill="#e2e8f0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13">Debug & improve</text>
</g>
<g filter="url(#shadow)">
<rect x="974" y="155" width="174" height="130" rx="17" fill="#17233c" stroke="#fb923c" stroke-width="2"/>
<rect x="986" y="165" width="150" height="4" rx="2" fill="#fb923c"/>
<text x="1061" y="210" fill="#fb923c" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="700">05  SHIP</text>
<text x="1061" y="243" fill="#e2e8f0" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="13">Publish & learn</text>
</g>
<text x="57" y="348" fill="#64748b" font-size="16" font-family="monospace">PYTHON   /   WEB   /   AUTOMATION   /   GIT &amp; GITHUB</text>
</svg>